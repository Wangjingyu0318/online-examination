<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正式考试 — AIProbe</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* ===== 考试布局 ===== */
        .exam-paper-layout {
            display: grid;
            grid-template-columns: 1fr 240px;
            gap: 20px;
            align-items: start;
        }
        @media (max-width: 860px) {
            .exam-paper-layout {
                grid-template-columns: 1fr;
            }
        }

        /* ===== 顶部信息栏 ===== */
        .exam-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .exam-top-bar .left h2 {
            margin: 0 0 4px 0;
            font-size: 18px;
        }
        .exam-top-bar .left .sub {
            font-size: 13px;
            color: var(--muted);
        }
        .exam-top-bar .timer-box {
            min-width: 130px;
            text-align: center;
            padding: 8px 16px;
            background: #fff3f1;
            border: 1px solid #f4d2ce;
            border-radius: 9px;
            color: var(--danger);
        }
        .exam-top-bar .timer-box small {
            display: block;
            font-size: 10px;
        }
        .exam-top-bar .timer-box strong {
            font-size: 22px;
            letter-spacing: 1px;
        }

        /* ===== 题目卡片 ===== */
        .question-panel {
            padding: 28px 28px 20px;
            min-height: 380px;
        }
        .q-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .q-header .q-index {
            font-weight: 700;
            font-size: 17px;
            color: var(--primary);
        }
        .q-header .q-type {
            background: var(--primary-soft);
            color: var(--primary);
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .q-header .q-score {
            color: var(--muted);
            font-size: 12px;
        }
        .q-stem {
            font-size: 16px;
            line-height: 1.9;
            margin-bottom: 24px;
        }

        /* ===== 选项 ===== */
        .options-list {
            display: grid;
            gap: 10px;
        }
        .option-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border: 1.5px solid #dce3eb;
            border-radius: 9px;
            cursor: pointer;
            transition: 0.15s;
        }
        .option-item:hover {
            border-color: #90b4d9;
            background: #f7fbff;
        }
        .option-item.selected {
            border-color: var(--primary);
            background: #edf5fd;
        }
        .option-item .radio-circle {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #b0bccd;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: 0.15s;
        }
        .option-item.selected .radio-circle {
            border-color: var(--primary);
        }
        .option-item.selected .radio-circle::after {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--primary);
        }
        .option-item .checkbox-square {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            border: 2px solid #b0bccd;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: 0.15s;
            font-size: 12px;
            color: white;
        }
        .option-item.selected .checkbox-square {
            border-color: var(--primary);
            background: var(--primary);
        }
        .option-item.selected .checkbox-square::after {
            content: "✓";
        }
        .option-item .opt-label {
            font-weight: 600;
            color: #4d6076;
            margin-right: 4px;
        }
        /* 填空题 */
        .blank-input {
            width: 100%;
            max-width: 500px;
            border: none;
            border-bottom: 2px solid #93a1b1;
            padding: 8px 2px;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
            background: transparent;
        }
        .blank-input:focus {
            border-color: var(--primary);
        }

        /* ===== 底部按钮 ===== */
        .q-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 28px;
            padding-top: 18px;
            border-top: 1px solid var(--line);
            flex-wrap: wrap;
            gap: 10px;
        }
        .q-footer .left-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn-outline {
            background: white;
            color: var(--primary);
            border: 1px solid #b9c9dc;
        }
        .btn-outline:hover {
            background: #f5f8fc;
        }
        .btn-save {
            background: #f0f4f8;
            color: var(--text);
            border: 1px solid var(--line);
        }
        .btn-save:hover {
            background: #e5e9ef;
        }

        /* ===== 答题卡 ===== */
        .answer-card {
            position: sticky;
            top: 90px;
        }
        .answer-card .card-body {
            padding: 16px;
        }
        .answer-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        .answer-grid .num {
            height: 36px;
            border: 1px solid #dbe2ea;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #667487;
            cursor: pointer;
            transition: 0.15s;
            background: white;
        }
        .answer-grid .num:hover {
            border-color: var(--primary);
        }
        .answer-grid .num.answered {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .answer-grid .num.current {
            outline: 2px solid #f1a834;
            outline-offset: 1px;
        }
        .answer-grid .num.saved {
            background: #fff3cd;
            border-color: #f5c842;
            color: #856404;
        }
        .answer-legend {
            display: flex;
            gap: 14px;
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 14px;
        }
        .answer-legend span::before {
            content: "";
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 3px;
            margin-right: 5px;
            vertical-align: -2px;
        }
        .answer-legend .done::before {
            background: var(--primary);
        }
        .answer-legend .current::before {
            background: white;
            outline: 2px solid #f1a834;
        }
        .answer-legend .saved::before {
            background: #fff3cd;
            border: 1px solid #f5c842;
        }
        .answer-legend .todo::before {
            background: white;
            border: 1px solid #dbe2ea;
        }

        .btn-submit-full {
            width: 100%;
            padding: 10px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-submit-full:hover {
            background: #a8322a;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            z-index: 150;
            right: 24px;
            top: 86px;
            min-width: 240px;
            max-width: 400px;
            background: #26384b;
            color: white;
            padding: 12px 18px;
            border-radius: 9px;
            box-shadow: var(--shadow);
            transform: translateY(-16px);
            opacity: 0;
            pointer-events: none;
            transition: 0.25s;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        .toast.success {
            background: var(--success);
        }
        .toast.warning {
            background: var(--warning);
        }
        .toast.error {
            background: var(--danger);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="app-shell">
        <!-- ===== 侧边栏 ===== -->
        <aside class="sidebar">
            <div class="side-brand">
                <div class="side-logo">📡</div>
                <div>
                    <strong>AIProbe</strong>
                    <small>在线考试与练习</small>
                </div>
            </div>
            <nav class="side-menu">
                <div class="menu-title">考生服务</div>
                <a href="/student/dashboard" class="menu-item"><span class="menu-icon">🏠</span><span>首页</span></a>
                <a href="/student/exam" class="menu-item"><span class="menu-icon">📋</span><span>我的考试</span></a>
                <a href="/student/practice" class="menu-item"><span class="menu-icon">✏️</span><span>在线练习</span></a>
                <a href="/student/records" class="menu-item"><span class="menu-icon">📊</span><span>练习记录</span></a>
                <div class="menu-title" style="margin-top:28px;">个人信息</div>
                <a href="/student/profile" class="menu-item"><span class="menu-icon">👤</span><span>信息确认</span></a>
            </nav>
            <div class="side-user">
                <div class="avatar">{{ user.name[0] if user else '考' }}</div>
                <div><strong>{{ user.name if user else '考生' }}</strong><small>考生</small></div>
            </div>
        </aside>

        <!-- ===== 主区域 ===== -->
        <main class="main">
            <header class="topbar">
                <div class="breadcrumb">📍 <strong id="pageTitle">人工智能专业基础考核</strong></div>
                <div class="top-actions">
                    <span style="font-size:13px;color:var(--muted);">{{ user.name if user else '考生' }} 同学</span>
                    <a href="/login" style="font-size:13px;color:var(--danger);">退出</a>
                </div>
            </header>

            <div class="content">

                <!-- ===== 顶部信息栏 ===== -->
                <div class="card exam-top-bar">
                    <div class="left">
                        <h2 id="examTitle">人工智能专业基础考核</h2>
                        <span class="sub" id="examSub">正式考试 · 同场题目一致，顺序随机</span>
                    </div>
                    <div class="timer-box">
                        <small>⏱ 剩余时间</small>
                        <strong id="timerDisplay">60:00</strong>
                    </div>
                </div>

                <!-- ===== 题目 + 答题卡 ===== -->
                <div class="exam-paper-layout">

                    <!-- 左侧：题目 -->
                    <div class="card question-panel" id="questionPanel">
                        <!-- 由 JS 动态渲染 -->
                    </div>

                    <!-- 右侧：答题卡 -->
                    <div class="card answer-card">
                        <div class="card-head"><h3>答题卡</h3></div>
                        <div class="card-body">
                            <div class="answer-grid" id="answerGrid"></div>
                            <div class="answer-legend">
                                <span class="done">已答</span>
                                <span class="saved">暂存</span>
                                <span class="current">当前</span>
                                <span class="todo">未答</span>
                            </div>
                            <button class="btn-submit-full" onclick="submitExam()">📤 提交试卷</button>
                        </div>
                    </div>

                </div>

            </div>
        </main>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        // 模拟题库（从你导入的150道中抽取一部分示例）
        // ============================================================
        var fullQuestionBank = [
            // 填空题
            { id: 1, type: '填空题', score: 2, category: 'ai_basic', stem: '人工智能按学习方式可分为监督学习、______和无监督学习三大类。', options: [] },

            { id: 4, type: '填空题', score: 2, category: 'ai_basic', stem: '在人工智能评价指标中，______率反映模型正确预测的正样本数占所有实际正样本数的比例。', options: [] },
            { id: 5, type: '填空题', score: 2, category: 'llm', stem: 'Transformer架构的核心机制是______机制。', options: [] },

            { id: 7, type: '填空题', score: 2, category: 'llm', stem: '大模型轻量化部署的常用技术包括模型压缩、______和知识蒸馏。', options: [] },
            { id: 8, type: '填空题', score: 2, category: 'data', stem: '数据标注过程中，______是指对标注结果进行质量检验，确保标注数据的准确性和一致性。', options: [] },
            { id: 9, type: '填空题', score: 2, category: 'llm', stem: 'RAG（检索增强生成）的核心思想是通过检索______中的相关信息来辅助大模型生成回答。', options: [] },
            { id: 10, type: '填空题', score: 2, category: 'security', stem: '在人工智能系统部署中，______部署方式将模型运行在终端设备上，可降低网络时延并保护数据隐私。', options: [] },

            { id: 11, type: '单选题', score: 2, category: 'ai_basic', stem: '下列关于机器学习与深度学习关系的表述，正确的是（ ）。', options: ['A. 深度学习是机器学习的一个子领域', 'B. 机器学习是深度学习的一个子领域', 'C. 两者没有包含关系', 'D. 两者是完全相同的概念'] },

            { id: 13, type: '单选题', score: 2, category: 'ai_basic', stem: '下列指标中，同时考虑精确率和召回率的是（ ）。', options: ['A. 准确率', 'B. 召回率', 'C. F1值', 'D. 鲁棒性'] },

            { id: 49, type: '判断题', score: 1, category: 'data', stem: '数据量越大，模型一定表现越好。（ ）', options: ['正确', '错误'] },
            { id: 50, type: '判断题', score: 1, category: 'ai_basic', stem: '迁移学习可以利用预训练模型的知识加速新任务的训练。（ ）', options: ['正确', '错误'] },
            { id: 51, type: '判断题', score: 1, category: 'ai_basic', stem: '交叉熵损失函数常用于分类任务。（ ）', options: ['正确', '错误'] },
            { id: 52, type: '判断题', score: 1, category: 'llm', stem: 'Transformer只能处理文本数据，不能处理图像。（ ）', options: ['正确', '错误'] },
            { id: 53, type: '判断题', score: 1, category: 'llm', stem: 'LoRA是一种参数高效的微调方法，只训练少量低秩矩阵。（ ）', options: ['正确', '错误'] },
            { id: 54, type: '判断题', score: 1, category: 'llm', stem: '大模型的参数量越大，推理速度越快。（ ）', options: ['正确', '错误'] },
        ];

        // ============================================================
        // 考试配置
        // ============================================================
        // 从URL参数读取模式：exam（考试）或 practice（练习）
        var urlParams = new URLSearchParams(window.location.search);
        var EXAM_MODE = urlParams.get('mode') || 'exam';
        var TOTAL_QUESTIONS = (EXAM_MODE === 'practice') ? 20 : 50;  // 练习20道，考试50道
        var EXAM_DURATION = 60 * 60;      // 60分钟

        // ============================================================
        // 状态变量
        // ============================================================
        var examQuestions = [];
        var currentIndex = 0;
        var answers = {};
        var savedStatus = {};             // 暂存标记
        var timerSeconds = EXAM_DURATION;
        var timerInterval = null;
        var isSubmitted = false;

        // ============================================================
        // 页面加载
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            // 从URL读取分类参数
            var category = urlParams.get('category');
            var questionPool = fullQuestionBank;

            // 如果指定了分类，先筛选对应分类的题目
            if (category) {
                questionPool = fullQuestionBank.filter(function(q) {
                    return q.category === category;
                });
            }

            // 从题库中随机抽取指定数量的题目（不足则取全部）
            var pickCount = Math.min(TOTAL_QUESTIONS, questionPool.length);
            examQuestions = shuffleAndPick(questionPool, pickCount);

            renderQuestion(currentIndex);
            renderAnswerGrid();
            startTimer();
            updateProgress();
        });

        // ============================================================
        // 工具：随机抽取不重复
        // ============================================================
        function shuffleAndPick(bank, count) {
            var shuffled = bank.slice();
            for (var i = shuffled.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = shuffled[i];
                shuffled[i] = shuffled[j];
                shuffled[j] = temp;
            }
            return shuffled.slice(0, count);
        }

        // ============================================================
        // 渲染题目
        // ============================================================
        function renderQuestion(index) {
            var q = examQuestions[index];
            if (!q) return;

            var panel = document.getElementById('questionPanel');
            var html = '';

            // 题头
            html += '<div class="q-header">';
            html += '  <span class="q-index">第 ' + (index + 1) + ' 题</span>';
            html += '  <span class="q-type">' + q.type + '</span>';
            html += '  <span class="q-score">' + q.score + ' 分</span>';
            if (savedStatus[q.id]) {
                html += '  <span style="background:#fff3cd;color:#856404;padding:1px 10px;border-radius:10px;font-size:11px;">⏺ 已暂存</span>';
            }
            html += '</div>';

            // 题干
            html += '<div class="q-stem">' + q.stem + '</div>';

            // 选项 / 填空
            if (q.type === '填空题') {
                var val = answers[q.id] || '';
                html += '<div><input type="text" class="blank-input" id="blankInput" placeholder="请输入答案..." value="' + val + '" oninput="saveBlank(' + q.id + ', this.value)"></div>';
            } else if (q.type === '判断题') {
                html += '<div class="options-list">';
                var labels = ['正确', '错误'];
                labels.forEach(function(label, idx) {
                    var letter = String.fromCharCode(65 + idx);
                    var isSelected = answers[q.id] && answers[q.id].includes(letter);
                    var selClass = isSelected ? 'selected' : '';
                    html += '<div class="option-item ' + selClass + '" onclick="toggleOption(' + q.id + ', \'' + letter + '\', this)">';
                    html += '  <div class="radio-circle"></div>';
                    html += '  <span><span class="opt-label">' + letter + '.</span> ' + label + '</span>';
                    html += '</div>';
                });
                html += '</div>';
            } else {
                html += '<div class="options-list">';
                q.options.forEach(function(opt) {
                    var letter = opt.charAt(0);
                    var isSelected = false;
                    if (answers[q.id]) {
                        if (q.type === '单选题') {
                            isSelected = answers[q.id] === letter;
                        } else {
                            isSelected = answers[q.id].includes(letter);
                        }
                    }
                    var selClass = isSelected ? 'selected' : '';
                    var content = opt.substring(3);
                    html += '<div class="option-item ' + selClass + '" onclick="toggleOption(' + q.id + ', \'' + letter + '\', this)">';
                    if (q.type === '单选题') {
                        html += '  <div class="radio-circle"></div>';
                    } else {
                        html += '  <div class="checkbox-square"></div>';
                    }
                    html += '  <span><span class="opt-label">' + letter + '.</span> ' + content + '</span>';
                    html += '</div>';
                });
                html += '</div>';
            }

            // 底部按钮
            html += '<div class="q-footer">';
            html += '  <div class="left-btns">';
            if (index > 0) {
                html += '    <button class="btn btn-light" onclick="goToQuestion(' + (index - 1) + ')">⬅ 上一题</button>';
            }
            if (index < examQuestions.length - 1) {
                html += '    <button class="btn btn-primary" onclick="goToQuestion(' + (index + 1) + ')">下一题 ➔</button>';
            }
            html += '    <button class="btn btn-save" onclick="saveCurrent()">💾 暂存</button>';
            html += '  </div>';
            html += '  <span style="font-size:13px;color:var(--muted);">' + (index + 1) + ' / ' + examQuestions.length + ' 题</span>';
            html += '</div>';

            panel.innerHTML = html;
            updateProgress();
            renderAnswerGrid();
        }

        // ============================================================
        // 选择选项（单选/多选/判断）
        // ============================================================
        function toggleOption(qid, letter, element) {
            if (isSubmitted) return;
            var q = examQuestions.find(function(item) { return item.id === qid; });
            if (!q) return;

            var isMulti = (q.type === '多选题');

            if (isMulti) {
                if (!answers[qid]) answers[qid] = [];
                var arr = answers[qid];
                var idx = arr.indexOf(letter);
                if (idx > -1) {
                    arr.splice(idx, 1);
                    if (arr.length === 0) delete answers[qid];
                } else {
                    arr.push(letter);
                    arr.sort();
                }
            } else {
                // 单选 / 判断
                if (answers[qid] === letter) {
                    delete answers[qid];
                } else {
                    answers[qid] = letter;
                }
            }

            // 重新渲染当前题目
            renderQuestion(currentIndex);
            renderAnswerGrid();
        }

        // ============================================================
        // 填空题保存
        // ============================================================
        function saveBlank(qid, value) {
            if (isSubmitted) return;
            if (value.trim()) {
                answers[qid] = value.trim();
            } else {
                delete answers[qid];
            }
            renderAnswerGrid();
        }

        // ============================================================
        // 暂存当前题目
        // ============================================================
        function saveCurrent() {
            if (isSubmitted) return;
            var q = examQuestions[currentIndex];
            if (answers[q.id]) {
                savedStatus[q.id] = true;
                showToast('✅ 第 ' + (currentIndex + 1) + ' 题已暂存');
                renderQuestion(currentIndex);
                renderAnswerGrid();
            } else {
                showToast('⚠️ 请先作答再暂存');
            }
        }

        // ============================================================
        // 跳转题目
        // ============================================================
        function goToQuestion(index) {
            if (isSubmitted) return;
            if (index >= 0 && index < examQuestions.length) {
                currentIndex = index;
                renderQuestion(index);
                renderAnswerGrid();
            }
        }

        // ============================================================
        // 渲染答题卡
        // ============================================================
        function renderAnswerGrid() {
            var grid = document.getElementById('answerGrid');
            var html = '';
            for (var i = 0; i < examQuestions.length; i++) {
                var q = examQuestions[i];
                var ans = answers[q.id];
                var isAnswered = ans !== undefined && ans !== null && ans !== '' && !(Array.isArray(ans) && ans.length === 0);
                var isSaved = savedStatus[q.id] || false;
                var isCurrent = (i === currentIndex);

                var cls = '';
                if (isAnswered) cls += ' answered';
                if (isSaved) cls += ' saved';
                if (isCurrent) cls += ' current';

                html += '<div class="num' + cls + '" onclick="goToQuestion(' + i + ')">' + (i + 1) + '</div>';
            }
            grid.innerHTML = html;
            updateProgress();
        }

        // ============================================================
        // 更新进度
        // ============================================================
        function updateProgress() {
            var answered = 0;
            for (var i = 0; i < examQuestions.length; i++) {
                var q = examQuestions[i];
                var ans = answers[q.id];
                if (ans !== undefined && ans !== null && ans !== '' && !(Array.isArray(ans) && ans.length === 0)) {
                    answered++;
                }
            }
            var sub = document.getElementById('examSub');
            var total = examQuestions.length;
            var modeText = (EXAM_MODE === 'exam') ? '正式考试' : '练习';

            // 分类练习时显示分类名称
            var category = urlParams.get('category');
            var categoryMap = {
                'ai_basic': '人工智能基础',
                'llm': '大模型',
                'data': '数据处理',
                'security': '安全合规'
            };
            if (category && categoryMap[category]) {
                modeText += ' · ' + categoryMap[category];
            }

            sub.textContent = modeText + ' · 同场题目一致，顺序随机 · ' + answered + '/' + total + ' 已答';
        }

        // ============================================================
        // 计时器
        // ============================================================
        function startTimer() {
            timerInterval = setInterval(function() {
                timerSeconds--;
                updateTimerDisplay();
                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    showToast('⏰ 时间到！系统将自动交卷。');
                    setTimeout(function() { submitExam(); }, 1000);
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            var mins = Math.floor(timerSeconds / 60);
            var secs = timerSeconds % 60;
            document.getElementById('timerDisplay').textContent =
                String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
        }

        // ============================================================
        // 提交试卷
        // ============================================================
        function submitExam() {
            if (isSubmitted) return;
            if (timerInterval) clearInterval(timerInterval);

            var total = examQuestions.length;
            var answered = 0;
            for (var i = 0; i < total; i++) {
                var q = examQuestions[i];
                var ans = answers[q.id];
                if (ans !== undefined && ans !== null && ans !== '' && !(Array.isArray(ans) && ans.length === 0)) {
                    answered++;
                }
            }

            if (answered < total) {
                if (!confirm('您还有 ' + (total - answered) + ' 道题未作答，确认交卷吗？')) {
                    // 恢复计时器
                    timerInterval = setInterval(function() {
                        timerSeconds--;
                        updateTimerDisplay();
                        if (timerSeconds <= 0) {
                            clearInterval(timerInterval);
                            showToast('⏰ 时间到！系统将自动交卷。');
                            setTimeout(function() { submitExam(); }, 1000);
                        }
                    }, 1000);
                    return;
                }
            }

            isSubmitted = true;
            showToast('✅ 交卷成功！');

            // 组装答案
            var result = [];
            for (var j = 0; j < total; j++) {
                var q = examQuestions[j];
                result.push({ id: q.id, answer: answers[q.id] || '' });
            }
            console.log('📤 提交答案:', result);

            // 跳转
            setTimeout(function() {
                window.location.href = '/student/result';
            }, 1500);
        }

        // ============================================================
        // Toast提示
        // ============================================================
        function showToast(msg) {
            var toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show';
            clearTimeout(toast._timer);
            toast._timer = setTimeout(function() {
                toast.className = 'toast';
            }, 3000);
        }
    </script>
